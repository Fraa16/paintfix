# Car packages. Prices are "ab"-prices for the smallest vehicle class (Kleinwagen), in EUR.
# All values are PROPOSALS for the kickoff workshop until the client confirms them (draft: true).
- id: exterior
  order: 1
  draft: true
  group: exterior
  priceFrom: 99
  name: { de: Außenaufbereitung, en: Exterior detail }
  duration: { de: ca. 2–3 Stunden, en: approx. 2–3 hours }
  summary:
    de: Gründliche Handwäsche mit Dekontamination. Für Autos, die wieder glänzen sollen.
    en: A thorough hand wash with decontamination. For cars that should shine again.
  includes:
    de:
      - Handwäsche im Zwei-Eimer-Verfahren
      - Felgen und Radkästen
      - Flugrost- und Teerentfernung
      - Scheiben außen
      - Sprühversiegelung für den Lack
    en:
      - Two-bucket hand wash
      - Wheels and wheel arches
      - Iron fallout and tar removal
      - Exterior glass
      - Spray sealant for the paint

- id: interior
  order: 2
  draft: true
  group: interior
  priceFrom: 129
  name: { de: Innenaufbereitung, en: Interior detail }
  duration: { de: ca. 3–4 Stunden, en: approx. 3–4 hours }
  summary:
    de: Sitze, Teppiche und Oberflächen tiefengereinigt. Für Familienautos, Firmenwagen und Hundebesitzer.
    en: Seats, carpets and surfaces deep-cleaned. For family cars, company cars and dog owners.
  includes:
    de:
      - Innenraum und Kofferraum gesaugt
      - Polster und Teppiche sprühextrahiert
      - Kunststoffe gereinigt und gepflegt
      - Lüftungsdüsen, Fugen und Details
      - Scheiben innen streifenfrei
    en:
      - Cabin and boot vacuumed
      - Upholstery and carpets extraction-cleaned
      - Plastics cleaned and dressed
      - Vents, gaps and details
      - Streak-free interior glass

- id: complete
  order: 3
  draft: true
