- id: exterior-wash
  order: 1
  icon: wash
  name: { de: Exterior-Wäsche, en: Exterior wash }
  desc:
    de: Nasswäsche im Hangar oder wasserlose Dry Wash auf dem Vorfeld. Schonend für Lack, Dichtungen und Sensorik.
    en: Wet wash in the hangar or waterless dry wash on the ramp. Gentle on paint, seals and sensors.
- id: brightwork
  order: 2
  icon: brightwork
  name: { de: Brightwork-Politur, en: Brightwork polishing }
  desc:
    de: Blankes Aluminium, Einlaufkanten und Spinner mit NUVITE NuShine II. Vom Oxidabtrag bis zum Spiegelglanz.
    en: Bare aluminium, leading edges and spinners with NUVITE NuShine II. From oxidation removal to a mirror finish.
- id: paint
  order: 3
  draft: true
  icon: paint
  name: { de: Lackpflege & Versiegelung, en: Paint care & protection }
  desc:
    de: Politur und Schutzversiegelung für lackierte Flächen, abgestimmt auf die Vorgaben des Herstellers.
    en: Polishing and protective sealant for painted surfaces, matched to manufacturer guidance.
- id: cabin
  order: 4
  icon: cabin
  name: { de: Kabinenaufbereitung, en: Cabin detailing }
  desc:
    de: Leder, Furnier, Teppiche, Galley und Waschraum. Mit materialverträglichen Produkten von Aero-Sense.
    en: Leather, veneer, carpets, galley and lavatory. With material-compatible Aero-Sense products.
- id: handover
  order: 5
  icon: handover
  name: { de: Vor Verkauf & Übergabe, en: Pre-sale & delivery }
  desc:
    de: Komplette Aufbereitung vor Verkauf, Übergabe oder Rückgabe aus der Wartung. Mit Fotodokumentation.
    en: Full detail before a sale, delivery or return from maintenance. With photo documentation.
- id: programme
  order: 6
  icon: programme
  name: { de: Pflegeprogramme, en: Care programmes }
  desc:
    de: Feste Intervalle für Halter, Operator und Management-Firmen. Ein Plan, eine Rechnung, ein Ansprechpartner.
    en: Fixed intervals for owners, operators and management companies. One plan, one invoice, one contact.
